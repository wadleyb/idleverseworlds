<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <title>Idleverse</title>
  <meta
    name="description"
    content="Idleverse is a living tiny-world simulator. Observe a planet, watch settlements evolve, and zoom down to walk through the world."
  />
  <meta name="theme-color" content="#081624" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    @font-face {
      font-family: "Darumadrop One";
      src: url("/fonts/DarumadropOne-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }

    @font-face {
      font-family: "Domine";
      src: url("/fonts/Domine-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }

    @font-face {
      font-family: "Domine";
      src: url("/fonts/Domine-SemiBold.ttf") format("truetype");
      font-weight: 600;
      font-style: normal;
    }

    @font-face {
      font-family: "Domine";
      src: url("/fonts/Domine-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body,
    #app {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    html,
    body {
      background: #081624;
      font-family: "Domine", Georgia, serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
